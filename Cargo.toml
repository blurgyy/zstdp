[package]
name = "zstdp"
version = "0.1.0"
edition = "2021"

[dependencies]
atty = "0.2.14"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11.8"
flate2 = "1.1.1"
humantime = "2.2.0"
log = "0.4.27"
mime_guess = "2.0.5"
percent-encoding = "2.3.1"
regex = "1.11.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Allocator: jemalloc replaces glibc malloc for the whole process. The
# `unprefixed_malloc_on_supported_platforms` feature makes it the C
# dependency's malloc too (libzstd's compression contexts; flate2 is pure
# Rust via miniz_oxide and already uses the global allocator). See
# `src/main.rs`.
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }
zstd = "0.12"
